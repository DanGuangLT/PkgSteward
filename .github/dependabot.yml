version: 2
updates:
  - package-ecosystem: npm
    directory: /pkgsteward_be
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Keep type definitions on the Node.js major in .nvmrc (24).
    ignore:
      - dependency-name: "@types/node"
        versions: [">=25"]
    # A dependency joins the first group it matches, so nestjs comes first:
    # all @nestjs/* packages update together, including majors.
    groups:
      nestjs:
        patterns: ["@nestjs/*"]
      minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(be)"

  - package-ecosystem: npm
    directory: /pkgsteward_fe
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "@types/node"
        versions: [">=25"]
    groups:
      nestjs:
        patterns: ["@nestjs/*"]
      minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(fe)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
