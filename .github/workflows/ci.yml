name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, build, test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: apps/api/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # `pnpm lint` runs ESLint with --fix: fail if it had to change anything.
      - name: Lint
        run: |
          pnpm lint
          git diff --exit-code

      - run: pnpm build
      - run: pnpm test
      - run: pnpm test:e2e

  frontend:
    name: Frontend (lint, checks, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm theme:check
      - run: pnpm i18n:check
      - run: pnpm test
      - run: pnpm build

  # Windows is the target platform; Node 22 is the oldest supported major.
  backend-windows:
    name: Backend on Windows, Node ${{ matrix.node }}
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: apps/api/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Lint
        shell: bash
        run: |
          pnpm lint
          git diff --exit-code

      - run: pnpm build

      # Jest loads the ESM-only NestJS packages through require(esm) only on Node 24.9+,
      # so Node 22 checks the built app instead of the test suites.
      - if: matrix.node == '24'
        run: pnpm test
      - if: matrix.node == '24'
        run: pnpm test:e2e

      - name: Start the built backend on Node 22
        if: matrix.node == '22'
        shell: pwsh
        run: |
          $data = Join-Path $env:RUNNER_TEMP 'pkgsteward-data'
          $scan = Join-Path $env:RUNNER_TEMP 'pkgsteward-scan'
          New-Item -ItemType Directory -Force $data, $scan | Out-Null
          $env:PKGSTEWARD_DATA_DIR = $data
          $env:SCAN_ROOT_PATHS = $scan
          $env:HOST = '127.0.0.1'
          $log = Join-Path $env:RUNNER_TEMP 'backend.log'
          $p = Start-Process node -ArgumentList 'dist/main.js' -RedirectStandardOutput $log -RedirectStandardError "$log.err" -PassThru -NoNewWindow
          $status = 0
          for ($i = 0; $i -lt 60 -and $status -ne 200; $i++) {
            Start-Sleep -Seconds 1
            try { $status = (Invoke-WebRequest -UseBasicParsing -TimeoutSec 5 'http://127.0.0.1:24681/api/v1/global-packages').StatusCode } catch { }
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Get-Content $log, "$log.err" -ErrorAction SilentlyContinue
          if ($status -ne 200) { throw "The backend did not answer on Node $(node -v) (status $status)" }
          if (Select-String -Path "$log.err" -Pattern '\[PkgSteward\]' -Quiet) { throw 'Unexpected Node version warning' }

  frontend-windows:
    name: Frontend on Windows, Node ${{ matrix.node }}
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm theme:check
      - run: pnpm i18n:check
      - run: pnpm test
      - run: pnpm build

  # Install paths: pnpm 10 per app with the tracked lockfiles (the root lockfile is git-ignored, and pnpm
  # freezes lockfiles in CI), and npm at the repository root (postinstall installs both apps).
  install-compat:
    name: Install with ${{ matrix.tool }} on Windows, Node 22
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        tool: ['pnpm 10', 'npm']
    steps:
      - uses: actions/checkout@v7

      - if: matrix.tool == 'pnpm 10'
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install and build each app with pnpm 10
        if: matrix.tool == 'pnpm 10'
        shell: bash
        run: |
          pnpm --version
          for app in apps/api apps/web; do
            (cd "$app" && pnpm install --frozen-lockfile && pnpm build)
          done

      - name: Install from the root and build with npm
        if: matrix.tool == 'npm'
        shell: bash
        run: |
          npm --version
          npm install
          for app in apps/api apps/web; do
            (cd "$app" && npm run build)
          done

  yarn-classic-windows:
    name: Yarn Classic on Windows, Node 24
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Download Yarn Classic
        run: >-
          npm install --prefix "$env:RUNNER_TEMP/yarn-classic"
          --no-save --no-package-lock yarn@1.22.22

      - name: Install, build and test with Yarn Classic
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          # Invoke Yarn directly so its lifecycle scripts use Yarn for both apps.
          $yarn = Join-Path $env:RUNNER_TEMP 'yarn-classic/node_modules/yarn/bin/yarn.js'
          node $yarn --version
          node $yarn install --non-interactive
          node $yarn build
          node $yarn --cwd apps/web test

      - name: Test the backend with Yarn Classic
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $yarn = Join-Path $env:RUNNER_TEMP 'yarn-classic/node_modules/yarn/bin/yarn.js'
          node $yarn --cwd apps/api test --runInBand
          node $yarn --cwd apps/api test:e2e --runInBand

      - name: Start both apps from the root with Yarn Classic
        run: |
          $ports = 24680, 24681
          if (Get-NetTCPConnection -State Listen -LocalPort $ports -ErrorAction SilentlyContinue) {
            throw 'A PkgSteward smoke-test port is already in use'
          }

          $yarn = Join-Path $env:RUNNER_TEMP 'yarn-classic/node_modules/yarn/bin/yarn.js'
          $smoke = Join-Path $env:RUNNER_TEMP 'pkgsteward-yarn-start'
          $scan = Join-Path $smoke 'scan'
          New-Item -ItemType Directory -Path $scan -Force | Out-Null
          $env:MODE = 'production'
          $env:HOST = '127.0.0.1'
          $env:PORT = $null
          $env:API_BASE_URL = 'http://127.0.0.1:24681/api/v1'
          $env:PKGSTEWARD_NO_BROWSER = '1'
          $env:PKGSTEWARD_DATA_DIR = Join-Path $smoke 'data'
          $env:SCAN_ROOT_PATHS = $scan

          $stdout = Join-Path $smoke 'stdout.log'
          $stderr = Join-Path $smoke 'stderr.log'
          $server = Start-Process node -ArgumentList ('"{0}" start' -f $yarn) -PassThru -WindowStyle Hidden `
            -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            $pending = @('http://127.0.0.1:24681/api/v1', 'http://127.0.0.1:24680/')
            for ($attempt = 0; $attempt -lt 30 -and $pending.Count -gt 0; $attempt++) {
              if ($server.HasExited) { throw "yarn start exited with code $($server.ExitCode)" }
              $pending = @($pending | Where-Object {
                try { (Invoke-WebRequest -Uri $_ -TimeoutSec 2).StatusCode -ne 200 }
                catch { $true }
              })
              if ($pending.Count -gt 0) { Start-Sleep -Seconds 1 }
            }
            if ($pending.Count -gt 0) { throw "No HTTP 200 from: $($pending -join ', ')" }
            Write-Output 'Root yarn start returned HTTP 200 for the API and web UI'
          } finally {
            try {
              if (-not $server.HasExited) {
                taskkill.exe /PID $server.Id /T /F
                if ($LASTEXITCODE -ne 0 -and -not $server.HasExited) {
                  throw "Could not stop the Yarn process tree: $($server.Id)"
                }
              }
            } finally {
              Get-Content -LiteralPath $stdout, $stderr
            }
          }
          if (Get-NetTCPConnection -State Listen -LocalPort $ports -ErrorAction SilentlyContinue) {
            throw 'A smoke-test port is still listening after shutdown'
          }
