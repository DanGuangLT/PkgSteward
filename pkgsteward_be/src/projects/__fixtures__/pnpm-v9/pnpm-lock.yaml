lockfileVersion: '9.0'
settings:
  autoInstallPeers: true
importers:
  .:
    dependencies:
      alpha:
        specifier: ^1.0.0
        version: 1.2.0
  workspaces/unused:
    dependencies:
      '@scope/extra':
        specifier: ^2.0.0
        version: 2.0.0
packages:
  alpha@1.2.0:
    resolution: {integrity: sha512-TEST}
  alpha@1.1.0:
    resolution: {integrity: sha512-TEST}
  '@scope/extra@2.0.0':
    resolution: {integrity: sha512-TEST}
snapshots:
  alpha@1.2.0:
    dependencies:
      ignored-snapshot: 99.0.0
  alpha@1.1.0: {}
  '@scope/extra@2.0.0': {}
